<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #0c2461;">
    <div class="signup-info">
        <form action="#">
            <h1>ثبت نام </h1>
            <label for="fullname">نام و نام خانوادگی</label>
            <input type="text" name="fullname" id="fullname" class="signup-input">
            <label for="username">نام کاربری</label>
            <input type="text" name="username" id="username" class="signup-input">
             <label for="email"> ایمیل</label>
            <input type="email" name="email" id="email" class="signup-input">
            <label for="tel">موبایل</label>
            <input type="tel" name="tel" id="tel" class="signup-input">
            <label for="password">رمز عبور</label>
            <input type="password" name="password" id="password" class="signup-input"> 
             <label for="password-again">تکرار رمز عبور</label>
            <input type="password" name="password-again" id="password-again" class="signup-input">
            <label for="city">انتخاب شهر</label>
            <select name="city" id="city" class="signup-input">
                <option value="placeholder" selected disabled>پیش فرض</option>
                <option value="kerman">کرمان</option>
                <option value="tehran">تهران</option>
                <option value="karaj">کرج</option>
                <option value="mashhad">مشهد</option>
                <option value="kermanshah">کرمانشاه</option>
                <option value="yazd">یزد</option>
                <option value="qom">قم</option>
            </select>
            <button type="submit" class="signup-btn">ثبت نام </button>
        </form>
          <a href="login.html">حساب کاربری دارید؟ اینجا کلیک کنید</a>
    </div>
  
</body>
</html>
