<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه ورود</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #0c2461;">
    <div class="login-info">
        <form action="#">
            <h1 style="text-align: center;">ورود</h1>
            <label for="fullname">نام کاربری</label>
            <input type="text" name="fullname" id="fullname"  class="login-input">
            <label for="email">ایمیل</label>
            <input type="email" name="email" id="email" class="login-input">
            <label for="password">رمز عبور </label>
            <input type="password" name="password" id="password" class="login-input">
            <div class="options">
                <label for="" class="remember-me">
                    <input type="checkbox" name="remember" id="remember">مرا به خاطر بسپار  
                </label>
                <button type="submit" class="login-btn">ورود</button>
        </form>
    </div>
    <br>
     <p><a href="signup.html">حساب کاربری ندارید؟ اینجا کلیک کنید</a></p>
</body>
</html>
